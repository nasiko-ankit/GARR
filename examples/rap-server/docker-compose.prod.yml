services:

  # ── RAP database ──────────────────────────────────────────────────────────
  rap-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rap
      POSTGRES_USER: rap
      POSTGRES_PASSWORD: ${RAP_POSTGRES_PASSWORD}
    volumes:
      - rap_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rap -d rap"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── RAP server (Registry Access Point) ────────────────────────────────────
  rap-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://rap:${RAP_POSTGRES_PASSWORD}@rap-postgres:5432/rap
      SIGNING_PRIVATE_KEY: ${RAP_SIGNING_PRIVATE_KEY}
      SIGNING_KEY_ID: ${RAP_SIGNING_KEY_ID:-rap-prod-2026}
      RAP_DOMAIN: ${RAP_DOMAIN}
      RAP_OWNER_ID: ${RAP_OWNER_ID}
      ADMIN_API_KEY: ${RAP_ADMIN_API_KEY}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
    depends_on:
      rap-postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Caddy reverse proxy ───────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rap-server
    restart: unless-stopped

volumes:
  rap_postgres_data:
  caddy_data:
  caddy_config:
