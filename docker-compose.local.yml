# Full local dev stack — all services, no Caddy, direct ports
#
#   garr-web:        http://localhost:3000
#   NANDA Index:     http://localhost:3001
#   Registry Server: http://localhost:3002
#
# Usage: docker compose -f docker-compose.local.yml --env-file .env.local up --build
#
# To tail logs:
#   docker compose -f docker-compose.local.yml logs -f garr-api
#   docker compose -f docker-compose.local.yml logs -f registry-server

services:

  # ── NANDA Index database ──────────────────────────────────────────────────────
  garr-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: garr
      POSTGRES_USER: garr
      POSTGRES_PASSWORD: ${GARR_POSTGRES_PASSWORD:-garr-local}
    ports:
      - "5433:5432"
    volumes:
      - garr_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garr -d garr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── NANDA Index Server ────────────────────────────────────────────────────────
  garr-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://garr:${GARR_POSTGRES_PASSWORD:-garr-local}@garr-postgres:5432/garr
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      SIGNING_PRIVATE_KEY: ${GARR_SIGNING_PRIVATE_KEY:-}
      SIGNING_KEY_ID: ${GARR_SIGNING_KEY_ID:-garr-dev-2026}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # OAuth redirects go to port 3001 (direct — no Caddy in this setup)
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SMTP_URL: ${SMTP_URL:-log}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@nanda.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      garr-postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Registry Server database ──────────────────────────────────────────────────
  registry-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${REGISTRY_POSTGRES_PASSWORD:-registry-local}
    ports:
      - "5434:5432"
    volumes:
      - registry_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Registry Server ───────────────────────────────────────────────────────────
  registry-server:
    build:
      context: ./registry-server
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://registry:${REGISTRY_POSTGRES_PASSWORD:-registry-local}@registry-postgres:5432/registry
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      REGISTRY_ADMIN_TOKEN: ${REGISTRY_ADMIN_TOKEN:-dev-token-change-in-production}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      registry-postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── garr-web (Next.js) ────────────────────────────────────────────────────────
  # NEXT_PUBLIC_* vars are baked into the Next.js bundle at build time.
  # They must reflect what the browser (on the host) can reach — localhost ports.
  garr-web:
    build:
      context: ../garr-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GARR_API_BASE_URL: ${NEXT_PUBLIC_GARR_API_BASE_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - garr-api
    restart: unless-stopped

volumes:
  garr_postgres_data:
  registry_postgres_data:
