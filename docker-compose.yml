# DBs only — use when running services natively with `npm run dev`
#
#   NANDA Index DB:  postgresql://garr:garr-local@localhost:5433/garr
#   Registry DB:     postgresql://registry:registry-local@localhost:5434/registry
#
# Usage: docker compose up -d

services:

  garr-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: garr
      POSTGRES_USER: garr
      POSTGRES_PASSWORD: garr-local
    ports:
      - "5433:5432"
    volumes:
      - garr_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garr -d garr"]
      interval: 5s
      timeout: 3s
      retries: 5

  registry-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry-local
    ports:
      - "5434:5432"
    volumes:
      - registry_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  garr_postgres_data:
  registry_postgres_data:
